<mat-sidenav-container class="sidenav-container" [class.collapsed]="collapsed">
  <mat-sidenav
    #sidenav
    class="sidenav"
    [class.collapsed]="collapsed"
    [mode]="'side'"
    [opened]="true"
    [fixedInViewport]="true">

    <div class="sidenav-header flex items-center gap-3 border-b border-white/[0.08] px-5 py-[22px]"
         *ngIf="appSettings.settings$ | async as s">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center overflow-hidden rounded-xl
                  bg-gradient-to-br from-[#94a3b8] to-[#cbd5e1] shadow-[0_6px_16px_rgba(100,116,139,0.45)]">
        <img *ngIf="s.appLogo" [src]="s.appLogo" alt="Logo" class="h-full w-full object-cover">
        <mat-icon *ngIf="!s.appLogo" class="!h-6 !w-6 !text-2xl text-white">admin_panel_settings</mat-icon>
      </div>
      <div class="brand-text leading-[1.2]">
        <h2 class="m-0 text-[17px] font-bold tracking-[-0.01em]">{{ s.appName }}</h2>
        <span class="app-subtitle text-xs font-normal text-white/50">Task Management</span>
      </div>
    </div>

    <p class="nav-section-label mx-4 mb-1.5 mt-[18px] text-[11px] font-semibold uppercase tracking-[0.08em] text-white/35">Menu</p>

    <mat-nav-list class="nav-list">
      <a mat-list-item
         *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active-link"
         [routerLinkActiveOptions]="{exact: item.route === '/dashboard'}"
         [matTooltip]="collapsed ? item.title : ''"
         matTooltipPosition="right">
        <mat-icon matListItemIcon [matBadge]="item.badge"
                  [matBadgeHidden]="!item.badge"
                  matBadgeColor="warn"
                  matBadgeSize="small">
          {{item.icon}}
        </mat-icon>
        <span matListItemTitle>{{item.title}}</span>
      </a>
    </mat-nav-list>

    <div class="sidenav-footer border-t border-white/[0.08] p-3">
      <button class="user-info" *ngIf="currentUser$ | async as user"
              [matMenuTriggerFor]="userMenu"
              type="button">
        <div class="flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full
                    bg-gradient-to-br from-[#94a3b8] to-[#cbd5e1] text-base font-semibold text-white">
          <img *ngIf="user.avatar" [src]="user.avatar" alt="Avatar" class="h-full w-full object-cover">
          <span *ngIf="!user.avatar">{{ (user.name || 'A').charAt(0).toUpperCase() }}</span>
        </div>
        <div class="user-details min-w-0">
          <p class="m-0 overflow-hidden text-ellipsis whitespace-nowrap text-sm font-semibold">{{user.name}}</p>
          <p class="m-0 text-xs text-white/50">Administrator</p>
        </div>
        <mat-icon class="user-caret !ml-auto !h-5 !w-5 !text-xl text-white/50">expand_less</mat-icon>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="ml-4 text-xl font-semibold tracking-[-0.01em]">Task Management System</span>

      <span class="flex-1"></span>

      <!-- Theme toggle -->
      <button mat-icon-button (click)="toggleTheme()"
              [matTooltip]="(themeService.isDark$ | async) ? 'Switch to light mode' : 'Switch to dark mode'">
        <mat-icon>{{ (themeService.isDark$ | async) ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <!-- Notifications -->
      <button mat-icon-button matTooltip="Notifications"
              [matMenuTriggerFor]="notifMenu">
        <mat-icon [matBadge]="notifications.length"
                  [matBadgeHidden]="!notifications.length"
                  matBadgeColor="warn" matBadgeSize="small">
          notifications
        </mat-icon>
      </button>

      <mat-menu #notifMenu="matMenu" class="notif-menu">
        <div class="notif-header">
          <span class="notif-title">Notifications</span>
          <span class="notif-count" *ngIf="notifications.length">{{ notifications.length }} new</span>
        </div>
        <mat-divider></mat-divider>

        <div class="notif-empty" *ngIf="!notifications.length">
          <mat-icon>notifications_none</mat-icon>
          <p>You're all caught up</p>
        </div>

        <button mat-menu-item *ngFor="let n of notifications" class="notif-item"
                routerLink="/settings" [queryParams]="{ section: 'notifications' }">
          <mat-icon>{{ n.icon }}</mat-icon>
          <div class="notif-item-text">
            <span class="notif-item-title">{{ n.title }}</span>
            <span class="notif-item-time">{{ n.time }}</span>
          </div>
        </button>

        <mat-divider *ngIf="notifications.length"></mat-divider>
        <button mat-menu-item class="notif-viewall"
                routerLink="/settings" [queryParams]="{ section: 'notifications' }">
          <mat-icon>open_in_new</mat-icon>
          <span>View all notifications</span>
        </button>
      </mat-menu>

      <!-- User Menu -->
      <mat-menu #userMenu="matMenu" yPosition="above" xPosition="after">
        <div class="min-w-[200px] bg-[#f5f5f5] p-4" *ngIf="currentUser$ | async as user">
          <p class="m-0 mb-2 text-sm font-medium">{{user.email}}</p>
          <p class="m-0 text-xs font-medium uppercase text-[#3f51b5]">Admin</p>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/settings" [queryParams]="{ section: 'profile' }">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content-wrapper min-h-[calc(100vh-64px)] bg-[var(--app-bg,#f4f6f8)] p-6">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
