<div
  class="login-page relative flex min-h-screen items-center justify-center overflow-hidden p-6 bg-[linear-gradient(135deg,#eef1f5_0%,#f6f8fa_45%,#dde3ea_100%)] dark:bg-[linear-gradient(135deg,#0f172a_0%,#334155_50%,#1e293b_100%)]"
>
  <button
    mat-icon-button
    type="button"
    data-theme-toggle
    class="!absolute right-5 top-5 z-[2] !text-slate-600 hover:bg-black/[0.06] dark:!text-slate-300 dark:hover:bg-white/10"
    (click)="toggleTheme()"
    [matTooltip]="
      (themeService.isDark$ | async)
        ? 'Switch to light mode'
        : 'Switch to dark mode'
    "
  >
    <mat-icon>{{
      (themeService.isDark$ | async) ? "light_mode" : "dark_mode"
    }}</mat-icon>
  </button>

  <div
    class="login-card relative z-[1] w-full max-w-[420px] rounded-[20px] border border-[#e6e9ee] bg-white pb-7 pl-9 pr-9 pt-10 shadow-none max-[480px]:rounded-2xl max-[480px]:pb-[22px] max-[480px]:pl-[22px] max-[480px]:pr-[22px] max-[480px]:pt-8 dark:border-[#262c40] dark:bg-[#171d2e]"
  >
    <div class="mb-7 text-center">
      <div
        class="mx-auto mb-4 flex h-[68px] w-[68px] items-center justify-center overflow-hidden rounded-[18px] bg-gradient-to-br from-[#94a3b8] to-[#cbd5e1] shadow-[0_10px_22px_rgba(100,116,139,0.4)]"
      >
        <img
          *ngIf="(appSettings.settings$ | async)?.appLogo as logo"
          [src]="logo"
          alt="Logo"
          class="h-full w-full object-cover"
        />
        <mat-icon
          *ngIf="!(appSettings.settings$ | async)?.appLogo"
          class="!h-9 !w-9 !text-[36px] text-white"
          >admin_panel_settings</mat-icon
        >
      </div>
      <h1
        class="m-0 text-[26px] font-bold tracking-[-0.02em] text-[#1e1b3a] max-[480px]:text-[23px] dark:text-[#e5e7eb]"
      >
        Admin Login
      </h1>
      <p class="mt-1.5 text-sm font-normal text-[#6b7280] dark:text-[#9ca3af]">
        Task Management System
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>email</mat-icon>
        <input
          matInput
          type="email"
          formControlName="email"
          placeholder="admin@example.com"
          autocomplete="email"
        />
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
          Email is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
          Please enter a valid email
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          formControlName="password"
          autocomplete="current-password"
        />
        <button
          mat-icon-button
          matSuffix
          (click)="hidePassword = !hidePassword"
          [attr.aria-label]="'Toggle password visibility'"
          [attr.aria-pressed]="!hidePassword"
          type="button"
        >
          <mat-icon>{{
            hidePassword ? "visibility_off" : "visibility"
          }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
          Password is required
        </mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
          Password must be at least 6 characters
        </mat-error>
      </mat-form-field>

      <div class="-mt-1 mb-2 text-right">
        <a
          routerLink="/forgot-password"
          class="text-[13px] font-medium text-[#475569] no-underline hover:underline dark:text-slate-300"
          >Forgot password?</a
        >
      </div>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="login-button w-full"
        [disabled]="loading || loginForm.invalid"
      >
        <mat-progress-spinner
          *ngIf="loading"
          class="inline-block"
          diameter="20"
          mode="indeterminate"
        >
        </mat-progress-spinner>
        <mat-icon *ngIf="!loading" class="!h-5 !w-5 !text-xl">login</mat-icon>
        <span>{{ loading ? "Signing in…" : "Login to Admin Panel" }}</span>
      </button>
    </form>

    <div
      class="mt-6 flex items-start gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-3 text-[12.5px] leading-[1.5] text-slate-500 dark:border-[#2b3352] dark:bg-[#1f2540] dark:text-slate-300"
    >
      <mat-icon class="!h-[18px] !w-[18px] shrink-0 !text-[18px] text-[#cbd5e1]"
        >info</mat-icon
      >
      <span
        >Admin access only. Regular users should use the main application.</span
      >
    </div>
  </div>
</div>
