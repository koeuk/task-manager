<div class="w-full">
  <h1 class="mb-6 text-[28px] font-bold tracking-[-0.02em] text-[#1e1b3a]">Reports</h1>

  <mat-card class="mb-6 px-5 py-[18px]">
    <div class="mb-3.5 flex items-center gap-2 text-[13px] font-semibold uppercase tracking-[0.02em] text-[#6b7280]">
      <mat-icon class="!h-5 !w-5 !text-xl !text-[#94a3b8]">date_range</mat-icon>
      <span>Filter by date range</span>
    </div>
    <form [formGroup]="rangeForm" class="range-form flex flex-wrap items-center gap-3">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-[180px]">
        <mat-label>Start date</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="start">
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <span class="font-semibold text-[#9ca3af]">—</span>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-[180px]">
        <mat-label>End date</mat-label>
        <input matInput [matDatepicker]="endPicker" formControlName="end">
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>

      <button mat-flat-button color="primary" type="button" (click)="loadReport()"
              class="!ml-1 !h-12 !rounded-[10px]">
        <mat-icon>refresh</mat-icon>
        Apply
      </button>
    </form>
  </mat-card>

  <div *ngIf="loading" class="flex justify-center p-10">
    <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
  </div>

  <div *ngIf="!loading && report">
    <div class="mb-6 grid grid-cols-[repeat(auto-fit,minmax(220px,1fr))] gap-5">
      <mat-card *ngFor="let card of summaryCards"
                class="summary-card flex items-center gap-4 !rounded-xl p-5"
                [ngClass]="'card-' + card.color">
        <div class="summary-icon flex h-[54px] w-[54px] items-center justify-center rounded-[14px]">
          <mat-icon>{{ card.icon }}</mat-icon>
        </div>
        <div>
          <h2 class="m-0 text-[28px] font-bold text-[#1e1b3a]">{{ cardValue(card.key) }}</h2>
          <p class="m-0 text-[13px] text-[#6b7280]">{{ card.title }}</p>
        </div>
      </mat-card>
    </div>

    <mat-card>
      <mat-card-header>
        <mat-card-title>Productivity by User</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="report.productivity_by_user" class="w-full">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>User</th>
            <td mat-cell *matCellDef="let u">{{ u.name }}</td>
          </ng-container>
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let u">{{ u.email }}</td>
          </ng-container>
          <ng-container matColumnDef="completed_tasks">
            <th mat-header-cell *matHeaderCellDef>Completed Tasks</th>
            <td mat-cell *matCellDef="let u">{{ u.completed_tasks }}</td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="productivityColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: productivityColumns;"></tr>
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="productivityColumns.length">
              <div class="p-8 text-center text-[#999]">No data for this range</div>
            </td>
          </tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
</div>
