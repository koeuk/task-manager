<h2 mat-dialog-title class="!px-4 !pb-1 !pt-4">{{ isEditMode ? 'Edit Project' : 'Create Project' }}</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="!flex min-w-[420px] flex-col !px-4 !pb-1 !pt-2">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Project name">
      <mat-error>Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <div class="flex gap-3">
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select formControlName="status">
          <mat-option value="planning">Planning</mat-option>
          <mat-option value="active">Active</mat-option>
          <mat-option value="on_hold">On Hold</mat-option>
          <mat-option value="completed">Completed</mat-option>
          <mat-option value="archived">Archived</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="max-w-[110px] !flex-1">
        <mat-label>Color</mat-label>
        <input matInput type="color" formControlName="color">
      </mat-form-field>
    </div>

    <div class="flex gap-3">
      <mat-form-field appearance="outline">
        <mat-label>Start date</mat-label>
        <input matInput [matDatepicker]="startPicker" formControlName="start_date">
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Due date</mat-label>
        <input matInput [matDatepicker]="duePicker" formControlName="due_date">
        <mat-datepicker-toggle matSuffix [for]="duePicker"></mat-datepicker-toggle>
        <mat-datepicker #duePicker></mat-datepicker>
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions class="!gap-2 !px-4 !pb-4 !pt-2" align="end">
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading">
      <mat-progress-spinner *ngIf="loading" diameter="18" mode="indeterminate" class="mr-2 inline-block"></mat-progress-spinner>
      <span>{{ isEditMode ? 'Save' : 'Create' }}</span>
    </button>
  </mat-dialog-actions>
</form>
