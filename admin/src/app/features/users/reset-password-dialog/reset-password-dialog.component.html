<h2 mat-dialog-title>Reset password</h2>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="flex min-w-[380px] flex-col pt-1.5">
    <p class="mb-3 mt-0 text-black/60 dark:text-[#cbd0da]">Set a new password for <strong>{{ data.email }}</strong>.</p>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>New password</mat-label>
      <mat-icon matPrefix class="!my-0 !ml-0.5 !mr-2 !text-[#9ca3af]">lock</mat-icon>
      <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
      <button mat-icon-button matSuffix type="button" (click)="hide = !hide">
        <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error>Minimum 8 characters</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Confirm password</mat-label>
      <mat-icon matPrefix class="!my-0 !ml-0.5 !mr-2 !text-[#9ca3af]">lock</mat-icon>
      <input matInput type="password" formControlName="confirm">
      <mat-error *ngIf="form.hasError('mismatch')">Passwords do not match</mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="undefined">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">Reset password</button>
  </mat-dialog-actions>
</form>
