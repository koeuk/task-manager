<div class="user-list-container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        <span>User Management</span>
        <span class="header-actions">
          <button mat-stroked-button (click)="exportCsv()">
            <mat-icon>download</mat-icon>
            Export CSV
          </button>
          <button mat-raised-button color="primary" (click)="openUserDialog()">
            <mat-icon>add</mat-icon>
            Add User
          </button>
        </span>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <!-- Filters -->
      <form [formGroup]="filterForm" class="filter-form">
        <mat-form-field appearance="outline">
          <mat-label>Search</mat-label>
          <input matInput formControlName="search" placeholder="Search by name or email">
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="">All</mat-option>
            <mat-option value="admin">Admin</mat-option>
            <mat-option value="user">User</mat-option>
          </mat-select>
        </mat-form-field>
      </form>

      <!-- Loading -->
      <div *ngIf="loading" class="loading-container">
        <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
      </div>

      <!-- Table -->
      <div class="table-container" *ngIf="!loading">
        <table mat-table [dataSource]="dataSource" matSort>
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let user">
              <div class="user-info">
                <mat-icon class="user-avatar">account_circle</mat-icon>
                <span>{{ user.name }}</span>
              </div>
            </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
            <td mat-cell *matCellDef="let user">{{ user.email }}</td>
          </ng-container>

          <!-- Role Column -->
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let user">
              <mat-chip [ngClass]="'role-' + user.role">
                <mat-icon *ngIf="user.role === 'admin'">admin_panel_settings</mat-icon>
                <mat-icon *ngIf="user.role === 'user'">person</mat-icon>
                {{ user.role | titlecase }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Phone Column -->
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone</th>
            <td mat-cell *matCellDef="let user">
              {{ user.phone || '-' }}
            </td>
          </ng-container>

          <!-- Created Date Column -->
          <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
            <td mat-cell *matCellDef="let user">
              {{ user.created_at | date:'short' }}
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let user">
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item [routerLink]="['/users', user.id]">
                  <mat-icon>visibility</mat-icon>
                  <span>View details</span>
                </button>
                <button mat-menu-item (click)="openUserDialog(user)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <button mat-menu-item (click)="changeUserRole(user)">
                  <mat-icon>swap_horiz</mat-icon>
                  <span>Change Role to {{ user.role === 'admin' ? 'User' : 'Admin' }}</span>
                </button>
                <button mat-menu-item (click)="resetPassword(user)">
                  <mat-icon>lock_reset</mat-icon>
                  <span>Reset Password</span>
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="deleteUser(user)" class="delete-action">
                  <mat-icon color="warn">delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- No data row -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              <div class="no-data">
                <mat-icon>people_outline</mat-icon>
                <p>No users found</p>
              </div>
            </td>
          </tr>
        </table>

        <mat-paginator
          [length]="totalUsers"
          [pageSize]="10"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (page)="onPageChange()"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
