<div class="w-full">
  <mat-card>
    <mat-card-header class="!mb-5 !flex w-full">
      <mat-card-title class="!m-0 !flex w-full flex-1 items-center justify-between">
        <span>User Management</span>
        <span class="ml-auto flex gap-2.5">
          <button mat-stroked-button (click)="exportCsv()" [disabled]="exporting">
            <mat-icon>download</mat-icon>
            {{ exporting ? 'Exporting…' : 'Export CSV' }}
          </button>
          <button mat-flat-button color="primary" (click)="openUserDialog()">
            <mat-icon>add</mat-icon>
            Add User
          </button>
        </span>
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <!-- Filters -->
      <form [formGroup]="filterForm" class="filter-form mb-5 flex gap-3 text-[13px]">
        <mat-form-field appearance="outline" class="max-w-[240px] flex-1">
          <mat-label>Search</mat-label>
          <input matInput formControlName="search" placeholder="Search by name or email">
          <mat-icon matPrefix>search</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="max-w-[240px] flex-1">
          <mat-label>Role</mat-label>
          <mat-select formControlName="role">
            <mat-option value="">All</mat-option>
            <mat-option value="admin">Admin</mat-option>
            <mat-option value="user">User</mat-option>
          </mat-select>
        </mat-form-field>
      </form>

      <!-- Loading -->
      <div *ngIf="loading" class="flex justify-center p-10">
        <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
      </div>

      <!-- Table -->
      <div class="overflow-auto" *ngIf="!loading">
        <table mat-table [dataSource]="dataSource" matSort (matSortChange)="onSortChange($event)" class="w-full">
          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let user">
              <div class="flex items-center gap-2">
                <mat-icon class="!text-[#666]">account_circle</mat-icon>
                <span>{{ user.name }}</span>
              </div>
            </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
            <td mat-cell *matCellDef="let user">{{ user.email }}</td>
          </ng-container>

          <!-- Role Column -->
          <ng-container matColumnDef="role">
            <th mat-header-cell *matHeaderCellDef>Role</th>
            <td mat-cell *matCellDef="let user">
              <mat-chip [ngClass]="'role-' + user.role">
                <mat-icon *ngIf="user.role === 'admin'">admin_panel_settings</mat-icon>
                <mat-icon *ngIf="user.role === 'user'">person</mat-icon>
                {{ user.role | titlecase }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Phone Column -->
          <ng-container matColumnDef="phone">
            <th mat-header-cell *matHeaderCellDef>Phone</th>
            <td mat-cell *matCellDef="let user">
              {{ user.phone || '-' }}
            </td>
          </ng-container>

          <!-- Created Date Column -->
          <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
            <td mat-cell *matCellDef="let user">
              {{ user.created_at | date:'short' }}
            </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let user">
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item [routerLink]="['/users', user.id]">
                  <mat-icon>visibility</mat-icon>
                  <span>View details</span>
                </button>
                <button mat-menu-item (click)="openUserDialog(user)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <button mat-menu-item (click)="changeUserRole(user)">
                  <mat-icon>swap_horiz</mat-icon>
                  <span>Change Role to {{ user.role === 'admin' ? 'User' : 'Admin' }}</span>
                </button>
                <button mat-menu-item (click)="resetPassword(user)">
                  <mat-icon>lock_reset</mat-icon>
                  <span>Reset Password</span>
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="deleteUser(user)" class="!text-[#f44336]">
                  <mat-icon color="warn">delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- No data row -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [attr.colspan]="displayedColumns.length">
              <div class="p-10 text-center text-[#999]">
                <mat-icon class="!mx-auto !h-12 !w-12 !text-5xl opacity-30">people_outline</mat-icon>
                <p class="mt-4">No users found</p>
              </div>
            </td>
          </tr>
        </table>

        <mat-paginator
          [length]="totalUsers"
          [pageSize]="10"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (page)="onPageChange()"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
