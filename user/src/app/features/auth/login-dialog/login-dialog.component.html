<div class="w-[380px] max-w-full">
  <div class="pb-2 text-center">
    <div class="mx-auto mb-2.5 flex h-[52px] w-[52px] items-center justify-center rounded-full
                bg-[linear-gradient(135deg,#94a3b8_0%,#64748b_100%)] text-white">
      <mat-icon class="!h-[26px] !w-[26px] !text-[26px]">lock</mat-icon>
    </div>
    <h2 mat-dialog-title class="!m-0 !p-0 !text-xl !font-semibold dark:!text-[#e5e7eb]">Log in to continue</h2>
    <p class="mb-3 mt-1 text-[13px] text-black/55 dark:text-[#9ca3af]">Sign in to your account to create or make changes.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content class="!flex flex-col pt-1">
      <div *ngIf="errorMessage"
           class="mb-3 flex items-center gap-2 rounded-lg bg-[rgba(244,67,54,0.1)] px-3 py-2 text-[13px] text-[#d32f2f]">
        <mat-icon class="!h-[18px] !w-[18px] !text-[18px]">error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>email</mat-icon>
        <input matInput type="email" formControlName="email" autocomplete="email" placeholder="you@example.com">
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" tabindex="-1">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
      </mat-form-field>

      <p class="-mt-1 mb-2.5 text-right">
        <a href="javascript:void(0)" (click)="goToForgotPassword()"
           class="text-[13px] font-medium text-[#64748b] no-underline hover:underline dark:text-[#cbd5e1]">Forgot password?</a>
      </p>

      <p class="m-0 text-[13px] text-black/60 dark:text-[#9ca3af]">
        Don't have an account?
        <a href="javascript:void(0)" (click)="goToRegister()"
           class="font-medium text-[#64748b] no-underline hover:underline dark:text-[#cbd5e1]">Register</a>
      </p>
    </mat-dialog-content>

    <mat-dialog-actions align="end" class="!px-0 !pb-1 !pt-2">
      <button mat-button type="button" [mat-dialog-close]="false" [disabled]="loading">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="loading">
        <mat-progress-spinner *ngIf="loading" diameter="18" mode="indeterminate" class="mr-2 inline-block"></mat-progress-spinner>
        <span>Sign In</span>
      </button>
    </mat-dialog-actions>
  </form>
</div>
