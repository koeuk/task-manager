<div class="login-dialog">
  <div class="brand">
    <div class="brand-badge"><mat-icon>lock</mat-icon></div>
    <h2 mat-dialog-title>Log in to continue</h2>
    <p class="subtitle">Sign in to your account to create or make changes.</p>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <mat-dialog-content>
      <div *ngIf="errorMessage" class="error-banner">
        <mat-icon>error_outline</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix>email</mat-icon>
        <input matInput type="email" formControlName="email" autocomplete="email" placeholder="you@example.com">
        <mat-error *ngIf="form.get('email')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="form.get('email')?.hasError('email')">Enter a valid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" tabindex="-1">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.get('password')?.hasError('required')">Password is required</mat-error>
      </mat-form-field>

      <p class="register-line">
        Don't have an account? <a href="javascript:void(0)" (click)="goToRegister()">Register</a>
      </p>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" [mat-dialog-close]="false" [disabled]="loading">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="loading">
        <mat-progress-spinner *ngIf="loading" diameter="18" mode="indeterminate"></mat-progress-spinner>
        <span>Sign In</span>
      </button>
    </mat-dialog-actions>
  </form>
</div>
