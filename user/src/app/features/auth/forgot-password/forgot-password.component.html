<div class="flex min-h-screen items-center justify-center p-6
            bg-[linear-gradient(135deg,#eef1f5_0%,#f6f8fa_45%,#dde3ea_100%)]">
  <div class="w-full max-w-[420px] rounded-[20px] border border-[#e6e9ee] bg-white pb-7 pl-9 pr-9 pt-10 shadow-none">
    <div class="mb-7 text-center">
      <div class="mx-auto mb-4 flex h-[68px] w-[68px] items-center justify-center rounded-[18px]
                  bg-gradient-to-br from-[#94a3b8] to-[#cbd5e1] shadow-[0_10px_22px_rgba(100,116,139,0.4)]
                  [&>mat-icon]:!h-[34px] [&>mat-icon]:!w-[34px] [&>mat-icon]:!text-[34px] [&>mat-icon]:text-white"><mat-icon>lock_reset</mat-icon></div>
      <h1 class="m-0 text-[24px] font-bold text-[#1e1b3a]">Reset Password</h1>
      <p class="mt-1.5 text-sm text-[#6b7280]">{{ step === 1 ? 'Enter your account email' : 'Choose a new password' }}</p>
    </div>

    <form *ngIf="step === 1" [formGroup]="emailForm" (ngSubmit)="requestToken()" class="flex flex-col">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Email</mat-label>
        <mat-icon matPrefix class="!my-0 !ml-1 !mr-2.5 !text-[#9ca3af]">email</mat-icon>
        <input matInput type="email" formControlName="email" placeholder="user@example.com">
        <mat-error>Please enter a valid email</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" class="w-full !mt-1 !flex !h-12 !items-center !justify-center !gap-2 !rounded-xl !font-semibold"
              [disabled]="emailForm.invalid || loading">
        <mat-progress-spinner *ngIf="loading" diameter="18" mode="indeterminate" class="inline-block"></mat-progress-spinner>
        <span>{{ loading ? 'Sending…' : 'Send reset token' }}</span>
      </button>
    </form>

    <form *ngIf="step === 2" [formGroup]="resetForm" (ngSubmit)="doReset()" class="flex flex-col">
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Reset token</mat-label>
        <mat-icon matPrefix class="!my-0 !ml-1 !mr-2.5 !text-[#9ca3af]">vpn_key</mat-icon>
        <input matInput formControlName="token">
        <mat-error>Token is required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>New password</mat-label>
        <mat-icon matPrefix class="!my-0 !ml-1 !mr-2.5 !text-[#9ca3af]">lock</mat-icon>
        <input matInput type="password" formControlName="password">
        <mat-error>Minimum 8 characters</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Confirm new password</mat-label>
        <mat-icon matPrefix class="!my-0 !ml-1 !mr-2.5 !text-[#9ca3af]">lock</mat-icon>
        <input matInput type="password" formControlName="password_confirmation">
        <mat-error *ngIf="resetForm.hasError('mismatch')">Passwords do not match</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" class="w-full !mt-1 !flex !h-12 !items-center !justify-center !gap-2 !rounded-xl !font-semibold"
              [disabled]="resetForm.invalid || loading">
        <mat-progress-spinner *ngIf="loading" diameter="18" mode="indeterminate" class="inline-block"></mat-progress-spinner>
        <span>{{ loading ? 'Resetting…' : 'Reset password' }}</span>
      </button>
    </form>

    <p class="mt-5 text-center text-sm"><a routerLink="/dashboard" class="font-semibold text-[#475569] no-underline hover:underline">Back to app</a></p>
  </div>
</div>
