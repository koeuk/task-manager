<div class="popup-card flex flex-col w-[420px] max-w-full">
  <div class="flex items-center justify-between border-b border-slate-100 px-5 py-3.5 dark:border-[#262c40]">
    <div class="flex items-center gap-2.5">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl"
           [ngClass]="data.danger ? 'bg-red-50 text-red-600 dark:bg-red-950/40 dark:text-red-400' : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200'">
        <mat-icon class="!h-5 !w-5 !text-[20px]">{{ data.danger ? 'warning' : 'help_outline' }}</mat-icon>
      </div>
      <h2 class="m-0 text-[15px] font-semibold text-slate-900 dark:text-[#e5e7eb]">{{ data.title }}</h2>
    </div>
    <button mat-icon-button type="button" [mat-dialog-close]="false" class="!h-8 !w-8 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" aria-label="Close dialog">
      <mat-icon class="!h-4 !w-4 !text-[18px]">close</mat-icon>
    </button>
  </div>
  <div class="px-5 py-4 text-sm leading-relaxed text-slate-600 dark:text-[#cbd0da]">
    {{ data.message }}
  </div>
  <div class="flex items-center justify-end gap-2.5 border-t border-slate-100 bg-slate-50/70 px-5 py-3.5 dark:border-[#262c40] dark:bg-[#131826]">
    <button mat-button [mat-dialog-close]="false" class="!rounded-lg text-slate-600 dark:text-slate-300">
      {{ data.cancelText || 'Cancel' }}
    </button>
    <button mat-flat-button
            [color]="data.danger ? 'warn' : 'primary'"
            [mat-dialog-close]="true"
            class="!rounded-lg !px-4">
      {{ data.confirmText || 'Confirm' }}
    </button>
  </div>
</div>
