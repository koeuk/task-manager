<mat-sidenav-container class="sidenav-container" [class.collapsed]="collapsed">
  <mat-sidenav #sidenav mode="side" [opened]="true" class="sidenav" [class.collapsed]="collapsed">
    <div class="sidenav-header">
      <mat-icon class="app-icon">task_alt</mat-icon>
      <span class="app-title">Task Manager</span>
    </div>

    <mat-nav-list>
      <a mat-list-item
         *ngFor="let item of menuItems"
         [routerLink]="item.route"
         routerLinkActive="active-link"
         [matTooltip]="collapsed ? item.label : ''"
         matTooltipPosition="right">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <button mat-icon-button (click)="toggleSidenav()">
        <mat-icon>menu</mat-icon>
      </button>
      
      <span class="spacer"></span>

      <button mat-icon-button (click)="toggleTheme()"
              [matTooltip]="(themeService.isDark$ | async) ? 'Switch to light mode' : 'Switch to dark mode'">
        <mat-icon>{{ (themeService.isDark$ | async) ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button mat-icon-button>
        <mat-icon matBadge="5" matBadgeColor="warn">notifications</mat-icon>
      </button>

      <button mat-button *ngIf="currentUser$ | async as user"
              [matMenuTriggerFor]="userMenu" class="user-chip">
        <span class="chip-inner">
          <span class="chip-avatar">
            <img *ngIf="user.avatar" [src]="user.avatar" alt="">
            <span *ngIf="!user.avatar">{{ (user.name || 'U').charAt(0) | uppercase }}</span>
          </span>
          <span class="chip-name">{{ user.name }}</span>
          <mat-icon class="chip-caret">expand_more</mat-icon>
        </span>
      </button>

      <mat-menu #userMenu="matMenu" class="user-menu-panel">
        <div class="um-header" *ngIf="currentUser$ | async as user" (click)="$event.stopPropagation()">
          <span class="um-avatar">
            <img *ngIf="user.avatar" [src]="user.avatar" alt="">
            <span *ngIf="!user.avatar">{{ (user.name || 'U').charAt(0) | uppercase }}</span>
          </span>
          <div class="um-info">
            <span class="um-name">{{ user.name }}</span>
            <span class="um-email">{{ user.email }}</span>
          </div>
        </div>
        <mat-divider></mat-divider>
        <button mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button>
        <button mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Settings</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item *ngIf="isGuest" (click)="login()">
          <mat-icon>login</mat-icon>
          <span>Log in</span>
        </button>
        <button mat-menu-item *ngIf="!isGuest" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </mat-toolbar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
